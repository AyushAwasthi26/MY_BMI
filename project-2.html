<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>
    <script src="./project-2.js"></script>
    <link rel="stylesheet" href="./project-2.css" />
  </head>
  <body>
    <!-- Floating particles for ambiance -->
    <div
      class="particle"
      style="top: 10%; left: 10%; width: 4px; height: 4px; animation-delay: 0s"
    ></div>
    <div
      class="particle"
      style="top: 20%; right: 10%; width: 6px; height: 6px; animation-delay: 2s"
    ></div>
    <div
      class="particle"
      style="
        bottom: 30%;
        left: 20%;
        width: 3px;
        height: 3px;
        animation-delay: 4s;
      "
    ></div>
    <div
      class="particle"
      style="
        bottom: 10%;
        right: 30%;
        width: 5px;
        height: 5px;
        animation-delay: 1s;
      "
    ></div>

    <div class="card">
      <h1>BMI Calculator</h1>

      <form id="form">
        <div class="form-group">
          <label for="weight">Weight (kg)</label>
          <input
            type="number"
            id="weight"
            step="0.1"
            min="0"
            placeholder="e.g., 70.5"
          />
        </div>
        <div class="form-group">
          <label for="height">Height (cm)</label>
          <input
            type="number"
            id="height"
            step="0.1"
            min="0"
            placeholder="e.g., 175.2"
          />
        </div>
        <button id="calculate-btn" type="submit">Calculate BMI</button>
      </form>

      <div id="result">
        <p class="result-placeholder">Your BMI result will appear here</p>
      </div>
    </div>
  </body>
</html>
